<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060810" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="easyPG — Next-generation hostel management platform. Multi-property management, QR onboarding, smart payments and more." />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>easyPG — Smart Hostel Management</title>

    <!-- Google Fonts: Space Grotesk + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* Initial splash loader — Obsidian Nexus */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #060810;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Inter', system-ui, sans-serif;
        color: white;
      }
      .ambient-orb {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, transparent 70%);
        filter: blur(60px);
        top: -80px;
        left: -60px;
        pointer-events: none;
      }
      .splash-logo {
        width: 160px;
        height: auto;
        object-fit: contain;
        animation: splash-float 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(0, 212, 170, 0.35));
        position: relative;
        z-index: 1;
      }
      .splash-bottom {
        position: absolute;
        bottom: 3.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      .loader-track {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .loader-fill {
        position: absolute;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #00d4aa, #2563eb);
        border-radius: 99px;
        animation: loader-sweep 1.4s ease-in-out infinite;
      }
      .splash-caption {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.3);
        font-weight: 500;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes loader-sweep {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="ambient-orb"></div>
        <img src="/logo.png" class="splash-logo" alt="easyPG" />
        <div class="splash-bottom">
          <div class="loader-track"><div class="loader-fill"></div></div>
          <div class="splash-caption">Initializing...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
